<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroFC self-test</title>
<style>
  :root { --bg: #0f1419; --fg: #e6e6e6; --muted: #8a96a3; --ok: #3fb950; --bad: #f85149; --card: #161b22; --line: #30363d; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .sc { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
  .sc h2 { font-size: 15px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
  .tag { font-weight: 700; padding: 1px 8px; border-radius: 4px; font-size: 12px; }
  .PASS { background: var(--ok); color: #000; } .FAIL { background: var(--bad); color: #fff; }
  ul { margin: 4px 0; padding-left: 20px; } li.bad { color: var(--bad); } li.good::marker { color: var(--ok); }
  table { border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  td { padding: 1px 12px 1px 0; } td:first-child { color: var(--muted); }
  #summary { font-size: 16px; font-weight: 600; margin: 8px 0; }
  button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<h1>AeroFC-R4 automated flight tests</h1>
<div class="muted">The real firmware (compiled to WebAssembly) flies the replica of the Gazebo X3 quadcopter, faster than real time.</div>
<div id="summary">Running...</div>
<button id="again">Run again</button>
<div id="out"></div>
<script type="module">
import { runAll } from "./js/scenarios.js";
const out = document.getElementById("out");
const summary = document.getElementById("summary");
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
async function go() {
  out.innerHTML = "";
  summary.textContent = "Running...";
  document.title = "AeroFC self-test: RUNNING";
  const filter = new URLSearchParams(location.search).get("only");
  const res = await runAll(filter, (r) => {
    const d = document.createElement("div");
    d.className = "sc";
    d.innerHTML = `<h2><span class="tag ${r.pass ? "PASS" : "FAIL"}">${r.pass ? "PASS" : "FAIL"}</span>${esc(r.name)}
      <span class="muted">${(r.ms / 1000).toFixed(1)} s</span></h2>
      <ul>${r.items.map((i) => `<li class="${i.pass ? "good" : "bad"}">${i.pass ? "" : "FAILED: "}${esc(i.msg)}</li>`).join("")}</ul>
      <table>${Object.entries(r.metrics).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>`;
    out.appendChild(d);
  });
  const passed = res.filter((r) => r.pass).length;
  summary.textContent = `${passed} / ${res.length} scenarios passed`;
  summary.style.color = passed === res.length ? "var(--ok)" : "var(--bad)";
  document.title = `AeroFC self-test: ${passed === res.length ? "ALL PASS" : "FAIL"} ${passed}/${res.length}`;
  window.__results = res;
}
document.getElementById("again").onclick = go;
go();
</script>
</body>
</html>
